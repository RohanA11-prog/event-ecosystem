[project]
name = "ecosystem-shared"
version = "0.1.0"
description = "Shared event contracts, settings and broker helpers"
requires-python = ">=3.12"
dependencies = [
    "aio-pika>=10.1.0",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ecosystem_shared"]
