[project]
name = "notification-service"
version = "0.1.0"
description = "Consumes payment events and sends (simulated) notifications"
requires-python = ">=3.12"
dependencies = [
    "ecosystem-shared",
    "fastapi>=0.142.2",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/notification_service"]

[tool.uv.sources]
ecosystem-shared = { workspace = true }
