[project]
name = "event-ecosystem"
version = "0.1.0"
description = "Async event-driven microservices in Python"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = ["ruff", "black", "mypy", "pytest", "pytest-asyncio", "httpx"]
scratch = [
    "aio-pika>=10.1.0",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.black]
line-length = 100

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
